version: '3.8'

services:
  adpilot:
    image: werikoliveira/adpilot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adpilot_saas
    ports:
      - "3000:3000"
    volumes:
      - /DATA/AppData/adpilot/data:/app/prisma
      - /DATA/AppData/adpilot/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/prisma/dev.db
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_APP_URL=https://adpilot.amplificagroup.com/
      - STRIPE_PRICE_ID=price_ADICIONAR_PRICE_ID_AQUI
    restart: unless-stopped
    x-casaos:
      envs:
        - container: STRIPE_SECRET_KEY
          description:
            en_us: "Stripe Secret Key (sk_live_...)"
            pt_br: "Chave Secreta do Stripe (sk_live_...)"
        - container: STRIPE_WEBHOOK_SECRET
          description:
            en_us: "Stripe Webhook Secret (whsec_...)"
            pt_br: "Segredo de Webhook do Stripe"
        - container: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          description:
            en_us: "Stripe Publishable Key (pk_live_...)"
            pt_br: "Chave Pública do Stripe"
        - container: NEXT_PUBLIC_APP_URL
          description:
            en_us: "App Domain URL"
            pt_br: "URL da Aplicação"
      port_map: "3000"

x-casaos:
  architectures:
    - amd64
    - arm64
  main: adpilot
  author: werikoliveira
  category: Marketing & AI
  description:
    en_us: "AdPilot AI — Autonomous Paid Traffic SaaS for Facebook Ads with OpenCode AI, SQLite & Stripe Billing."
    pt_br: "AdPilot AI — SaaS de Gestão de Tráfego Pago Autônomo para Facebook Ads com IA, SQLite e LGPD."
  developer: WerikoEntusiasta
  icon: https://raw.githubusercontent.com/WerikoEntusiasta/adpilot/main/public/icon.png
  tagline:
    en_us: "AI-Powered Facebook Ads Management SaaS"
    pt_br: "SaaS de Gestão de Tráfego Pago com IA Autônoma"
  title:
    en_us: "AdPilot AI"
    pt_br: "AdPilot AI"
  index: /
