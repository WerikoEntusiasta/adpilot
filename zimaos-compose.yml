version: '3.8'

services:
  adpilot:
    image: werikoliveira/adpilot:latest
    container_name: adpilot_zimaos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    x-casaos:
      envs:
        - container: STRIPE_SECRET_KEY
          description:
            en_us: "Stripe Secret Key (sk_live_... or sk_test_...)"
            pt_br: "Chave Secreta do Stripe para assinatura de R$ 250/mês"
        - container: STRIPE_WEBHOOK_SECRET
          description:
            en_us: "Stripe Webhook Secret (whsec_...)"
            pt_br: "Segredo de Webhook do Stripe"
        - container: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          description:
            en_us: "Stripe Publishable Key (pk_live_...)"
            pt_br: "Chave Pública do Stripe"
        - container: NEXT_PUBLIC_APP_URL
          description:
            en_us: "App Domain URL (e.g. http://192.168.1.100:3000)"
            pt_br: "URL da Aplicação (Ex: http://zimaos.local:3000)"
      port_map: "3000"

x-casaos:
  architectures:
    - amd64
    - arm64
  main: adpilot
  author: werikoliveira
  category: Marketing & AI
  description:
    en_us: "AdPilot AI — Autonomous Paid Traffic SaaS for Facebook Ads with OpenCode AI and Stripe Billing."
    pt_br: "AdPilot AI — SaaS de Gestão de Tráfego Pago Autônomo para Facebook Ads com IA e Stripe."
  developer: WerikoEntusiasta
  icon: https://raw.githubusercontent.com/WerikoEntusiasta/adpilot/main/public/icon.png
  tagline:
    en_us: "AI-Powered Facebook Ads Management SaaS"
    pt_br: "SaaS de Gestão de Tráfego Pago com IA Autônoma"
  title:
    en_us: "AdPilot AI"
    pt_br: "AdPilot AI"
  index: /
